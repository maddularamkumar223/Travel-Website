<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="../navbar/navbar.css" />
    <link rel="stylesheet" href="./addpackage.css" />
    <style>
      section {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        place-items: center;
        height: 90%;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <main>
      <nav id="nav_container"></nav>
      <section>
        <article id="registerImage" style="height: 100%;">
          <img src="../assets/addPackage.png" alt="add Package" />
        </article>
        <form action="" id="form_data">
          <article style="text-align: center">
            <h1>Add Packages Here</h1>
          </article>
          <article>
            <label for="">Destination Name</label>
            <input
              type="text"
              name="destination"
              placeholder="Enter Your Destination Place"
            />
          </article>
          <article>
            <label for="">Days</label>
            <input type="text" name="days" placeholder="Enter The Days" />
          </article>
          <article>
            <label for="">Price</label>
            <input
              type="number"
              name="price"
              placeholder="Enter the trip price"
            />
          </article>
          <article>
            <label for="">Description</label>
            <textarea
              name="description"
              id="description"
              placeholder="Enter Your Description"
            ></textarea>
          </article>

          <article>
            <label for="">Image</label>
            <input type="file" name="image" />
          </article>
          <article>
            <button>Submit</button>
          </article>
        </form>
      </section>
    </main>
    <script src="./addPackage.js"></script>
    <script src="../navbar/navbar.js"></script>
  </body>
</html>
